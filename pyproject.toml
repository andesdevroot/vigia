[project]
name = "vigia"
version = "0.1.0"
description = "Verificador ciudadano de mensajes reenviados, por WhatsApp. La IA propone, el determinismo decide."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-CORPUS", "NOTICE"]
authors = [{ name = "Cesar Rivas", email = "crivasdev@icloud.com" }]
keywords = ["phishing", "smishing", "chile", "claveunica", "whatsapp", "csirt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not integracion'"
markers = ["integracion: golpea servicios externos; requiere VIGIA_INTEGRACION=1"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
